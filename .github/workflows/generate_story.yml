name: Generate Web Story Daily

on:
  schedule:
    # 외부 크론잡(cron-job.org)이 하루 3번 workflow_dispatch API로 트리거합니다.
    # 내부 크론은 깃허브 서버 사정에 따라 씹힐 수 있어 외부 트리거를 사용합니다.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: |
          npm ci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Web Story Generator (Gemini + Nano Banana 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # python 스크립트 실행
          python scripts/generate_web_story.py

      - name: Submit to Google Indexing API
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CREDENTIALS_JSON: ${{ secrets.BLOGGER_CREDENTIALS_JSON }}
        run: |
          python scripts/submit_index.py --yes

      - name: Submit to X (Twitter)
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install twitter-api-v2
          node scripts/submit_twitter.js

      - name: Commit and Push generated stories and images
        run: |
          git config --local user.email "admin@math.stac100.com"
          git config --local user.name "WebStory Generator"
          # 새롭게 추가된 json과 이미지 파일들을 모두 Git에 추가
          git add src/data/stories.json public/stories/* scripts/.submitted_urls.json scripts/.submitted_twitter_urls.json
          # 변경 사항이 있을 때만 커밋
          git commit -m "✨ Auto-generate new Web Story via Gemini & index & tweet" || echo "No changes to commit"
          git push
